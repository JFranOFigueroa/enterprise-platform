{{- if .Values.liquibase.enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "iumbit.fullname" . }}-liquibase
  labels:
    {{- include "iumbit.labels" . | nindent 4 }}
    app.kubernetes.io/component: liquibase
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Replace=true
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        {{- include "iumbit.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: liquibase
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL to be ready..."
              until nc -z {{ include "iumbit.fullname" . }}-postgresql 5432; do
                echo "PostgreSQL not ready yet, waiting..."
                sleep 2
              done
              echo "PostgreSQL is ready"
      containers:
        - name: liquibase
          image: "{{ .Values.liquibase.image.repository }}:{{ .Values.liquibase.image.tag }}"
          imagePullPolicy: IfNotPresent
          args: ["update"]
          env:
            - name: LIQUIBASE_COMMAND_URL
              value: "jdbc:postgresql://{{ include "iumbit.fullname" . }}-postgresql:5432/{{ .Values.postgresql.auth.database }}"
            - name: LIQUIBASE_COMMAND_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "iumbit.fullname" . }}-secrets
                  key: DB_USERNAME
            - name: LIQUIBASE_COMMAND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "iumbit.fullname" . }}-secrets
                  key: DB_PASSWORD
            - name: LIQUIBASE_COMMAND_CHANGELOG_FILE
              value: {{ .Values.liquibase.changelogFile | quote }}
          resources:
            {{- toYaml .Values.liquibase.resources | nindent 12 }}
{{- end }}
