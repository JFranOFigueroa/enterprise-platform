apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "iumbit.fullname" . }}-backend
  labels:
    {{- include "iumbit.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      {{- include "iumbit.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "iumbit.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL to be ready..."
              for i in $(seq 1 90); do
                if nc -z {{ include "iumbit.fullname" . }}-postgresql 5432; then
                  break
                fi
                echo "PostgreSQL not ready yet (attempt $i/90), waiting..."
                sleep 2
              done
              nc -z {{ include "iumbit.fullname" . }}-postgresql 5432 || { echo "ERROR: PostgreSQL did not become ready in time"; exit 1; }
              echo "PostgreSQL is ready"
              # Give Liquibase time to complete migrations
              sleep 15
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "iumbit.fullname" . }}-config
            - secretRef:
                name: {{ include "iumbit.fullname" . }}-secrets
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          startupProbe:
            exec:
              command:
                - curl
                - -fsS
                - http://127.0.0.1:9990/health/ready
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - curl
                - -fsS
                - http://127.0.0.1:9990/health/ready
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - curl
                - -fsS
                - http://127.0.0.1:9990/health/ready
            periodSeconds: 5
            failureThreshold: 10
            initialDelaySeconds: 30
