global:
  environment: qa

postgresql:
  primary:
    persistence:
      size: 20Gi
    resources:
      requests:
        cpu: 500m
        memory: 1Gi

backend:
  replicas: 2
  hpa:
    enabled: false

frontend:
  replicas: 2
  hpa:
    enabled: false

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: iumbit-qa.local
      paths:
        - path: /
          pathType: Prefix
          serviceName: frontend
          servicePort: 8080
        - path: /api
          pathType: Prefix
          serviceName: backend
          servicePort: 8080

liquibase:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
