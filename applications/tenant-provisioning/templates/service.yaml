apiVersion: v1
kind: Service
metadata:
  name: {{ include "tenant-provisioning.fullname" . }}
  labels:
    {{- include "tenant-provisioning.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "tenant-provisioning.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
