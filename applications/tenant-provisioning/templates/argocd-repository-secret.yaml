# ArgoCD repository credentials for the tenants repo (in the gitops namespace),
# required by the tenant-apps ApplicationSet git generator and tenant $values sources.
apiVersion: v1
kind: Secret
metadata:
  name: tenants-repo-credentials
  namespace: gitops
  labels:
    argocd.argoproj.io/secret-type: repository
  annotations:
    argocd.argoproj.io/sync-wave: "0"
type: Opaque
data:
  type: {{ "git" | b64enc | quote }}
  url: {{ .Values.config.tenantsRepoUrl | b64enc | quote }}
  username: {{ "x-access-token" | b64enc | quote }}
  password: {{ .Values.secrets.tenantsRepoToken | b64enc | quote }}
