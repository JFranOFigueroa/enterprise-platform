apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tenant-provisioning.fullname" . }}-config
  labels:
    {{- include "tenant-provisioning.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
data:
  TENANTS_REPO_URL: {{ .Values.config.tenantsRepoUrl | quote }}
  TENANTS_REPO_BRANCH: {{ .Values.config.tenantsRepoBranch | quote }}
  TENANTS_REPO_PATH: {{ .Values.config.tenantsRepoPath | quote }}
  DOMAIN_BASE: {{ .Values.config.domainBase | quote }}
  NAMESPACE_PREFIX: {{ .Values.config.namespacePrefix | quote }}
  RELEASE_SUFFIX: {{ .Values.config.releaseSuffix | quote }}
  ARGOCD_SERVER: {{ .Values.config.argocdServer | quote }}
  ARGOCD_INSECURE: {{ .Values.config.argocdInsecure | default "true" | quote }}
  SEALED_SECRETS_NAMESPACE: {{ .Values.config.sealedSecretsNamespace | quote }}
  SEALED_SECRETS_SERVICE: {{ .Values.config.sealedSecretsService | quote }}
  STORAGE_CLASS: {{ .Values.config.storageClass | default "local-path" | quote }}
  TLS_ISSUER: {{ .Values.config.tlsIssuer | default "letsencrypt-production" | quote }}
  DEFAULT_BACKEND_TAG: {{ .Values.config.defaultBackendTag | quote }}
  DEFAULT_FRONTEND_TAG: {{ .Values.config.defaultFrontendTag | quote }}
  DEFAULT_LIQUIBASE_TAG: {{ .Values.config.defaultLiquibaseTag | quote }}
  GIT_USER_NAME: {{ .Values.config.gitUserName | quote }}
  GIT_USER_EMAIL: {{ .Values.config.gitUserEmail | quote }}
  WORK_DIR: {{ .Values.config.workDir | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | default "INFO" | quote }}
