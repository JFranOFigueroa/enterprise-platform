apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tenant-provisioning.fullname" . }}
  labels:
    {{- include "tenant-provisioning.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
---
# Read-only access to ArgoCD Applications (in the gitops namespace) so the TPS
# can report tenant provisioning status.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "tenant-provisioning.fullname" . }}-applications
  namespace: gitops
  labels:
    {{- include "tenant-provisioning.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "tenant-provisioning.fullname" . }}-applications
  namespace: gitops
  labels:
    {{- include "tenant-provisioning.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
subjects:
  - kind: ServiceAccount
    name: {{ include "tenant-provisioning.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "tenant-provisioning.fullname" . }}-applications
---
# Namespace lifecycle management for deprovisioning (tenant namespace cleanup).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "tenant-provisioning.fullname" . }}-namespaces
  labels:
    {{- include "tenant-provisioning.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "tenant-provisioning.fullname" . }}-namespaces
  labels:
    {{- include "tenant-provisioning.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
subjects:
  - kind: ServiceAccount
    name: {{ include "tenant-provisioning.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "tenant-provisioning.fullname" . }}-namespaces
