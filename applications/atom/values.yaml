# Enterprise Platform - ATOM Base Values
global:
  environment: production

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "18.0-trixie"
  auth:
    postgresPassword: postgres
    database: atom
  primary:
    persistence:
      enabled: true
      size: 20Gi
      storageClassName: local-path
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 150m
        memory: 256Mi
    initSql:
      enabled: true
      configMapName: ""

backend:
  enabled: true
  image:
    repository: nitesoftmx/atom-wildfly-app
    tag: "1.0.0-dev.2"
  port: 8080
  replicas: 1
  javaOpts: "-Xms256m -Xmx512m -XX:MetaspaceSize=128m -XX:MaxMetaspaceSize=256m"
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 800m
      memory: 1Gi
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 85
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
          - type: Percent
            value: 25
            periodSeconds: 60
      scaleUp:
        stabilizationWindowSeconds: 30
        policies:
          - type: Percent
            value: 50
            periodSeconds: 60
          - type: Pods
            value: 1
            periodSeconds: 60
        selectPolicy: Min

frontend:
  enabled: true
  image:
    repository: nitesoftmx/atom-nginx-web
    tag: "1.0.0-dev.2"
  port: 8080
  replicas: 1
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 75
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
          - type: Percent
            value: 25
            periodSeconds: 60
      scaleUp:
        stabilizationWindowSeconds: 30
        policies:
          - type: Percent
            value: 50
            periodSeconds: 60
          - type: Pods
            value: 1
            periodSeconds: 60
        selectPolicy: Min

proxy:
  enabled: true
  image:
    repository: openresty/openresty
    tag: "alpine"
  port: 8080
  nodePort: 31081
  replicas: 1
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

secrets:
  dbUsername: "CHANGE_ME"
  dbPassword: "CHANGE_ME"

config:
  serverPort: "8080"
  dbUrl: "jdbc:postgresql://atom-postgresql:5432/atom"
  nodeEnv: "production"
  viteBackendUrl: "http://185.253.155.4:31081"
