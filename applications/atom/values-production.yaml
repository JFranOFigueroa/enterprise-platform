# Enterprise Platform - ATOM Production Values
# Ingress + TLS for stradtix.sytes.net via cert-manager (letsencrypt-production).
# The ingress routes ALL traffic to the OpenResty proxy, which internally
# distributes to the backend/frontend (see templates/proxy/configmap.yaml).
global:
  environment: production

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-production
  hosts:
    - host: stradtix.sytes.net 
      paths:
        - path: /
          pathType: Prefix
          serviceName: proxy
          servicePort: 8080
  tls:
    - secretName: atom-tls
      hosts:
        - stradtix.sytes.net
