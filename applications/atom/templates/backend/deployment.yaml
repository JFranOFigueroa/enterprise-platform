apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "atom.fullname" . }}-backend
  labels:
    {{- include "atom.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      {{- include "atom.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "atom.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL to be ready..."
              until nc -z {{ include "atom.fullname" . }}-postgresql 5432; do
                echo "PostgreSQL not ready yet, waiting..."
                sleep 2
              done
              echo "PostgreSQL is ready"
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "atom.fullname" . }}-config
            - secretRef:
                name: {{ include "atom.fullname" . }}-secrets
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          startupProbe:
            exec:
              command:
                - curl
                - -fsS
                - http://127.0.0.1:9990/health/ready
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - curl
                - -fsS
                - http://127.0.0.1:9990/health/ready
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - curl
                - -fsS
                - http://127.0.0.1:9990/health/ready
            periodSeconds: 5
            failureThreshold: 10
            initialDelaySeconds: 30
