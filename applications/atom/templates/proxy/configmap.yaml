apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "atom.fullname" . }}-proxy-config
  labels:
    {{- include "atom.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
data:
  nginx.conf: |
    worker_processes 1;
    events {
      worker_connections 1024;
    }
    http {
      include      /etc/nginx/mime.types;
      default_type application/octet-stream;
      sendfile     on;
      keepalive_timeout 65;

      server {
        listen {{ .Values.proxy.port }} default_server;
        server_name _;

        location / {
          proxy_pass http://{{ include "atom.fullname" . }}-frontend:{{ .Values.frontend.port }};
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /core/ {
          proxy_pass http://{{ include "atom.fullname" . }}-backend:{{ .Values.backend.port }}/sicc/;
          proxy_cookie_path /sicc /core;
          proxy_cookie_flags ~ secure off;
          proxy_set_header Host $host;
        }

        location /wms/ {
          proxy_pass http://{{ include "atom.fullname" . }}-backend:{{ .Values.backend.port }}/sicc-wms/;
          proxy_cookie_path /sicc-wms /wms;
          proxy_cookie_flags ~ secure off;
          proxy_set_header Host $host;
        }

        location /pos/ {
          proxy_pass http://{{ include "atom.fullname" . }}-backend:{{ .Values.backend.port }}/sicc-pos/;
          proxy_cookie_path /sicc-pos /pos;
          proxy_cookie_flags ~ secure off;
          proxy_set_header Host $host;
        }

        location /api/ {
          proxy_pass http://{{ include "atom.fullname" . }}-backend:{{ .Values.backend.port }};
          proxy_set_header Host $host;
        }
      }
    }
