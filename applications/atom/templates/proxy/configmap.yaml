apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "atom.fullname" . }}-proxy-config
  labels:
    {{- include "atom.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
data:
  default.conf: |
    server {
        listen {{ .Values.proxy.port }};

        # El proxy escucha en el puerto interno (8080) pero se expone por el
        # NodePort externo (31081). nginx arma redirects internos (p.ej. agregar
        # slash en /pos -> /pos/) como URLs absolutas con $server_port (8080),
        # puerto que no esta expuesto y rompe la recarga. Con absolute_redirect
        # off esos redirects se emiten como rutas relativas (/pos/) y el
        # navegador las resuelve contra el puerto externo correcto (31081).
        absolute_redirect off;

        header_filter_by_lua_block {
            local cookies = ngx.header["Set-Cookie"]
            if cookies then
                if type(cookies) == "table" then
                    for i, c in ipairs(cookies) do
                        cookies[i] = c:gsub(";%s*Secure", "")
                    end
                else
                    ngx.header["Set-Cookie"] = cookies:gsub(";%s*Secure", "")
                end
            end

            -- Fix redirects del backend (modulo POS): al recargar /pos, el
            -- backend WildFly emite un Location con su puerto interno :8080,
            -- que no esta expuesto. Reescribirlo al NodePort real :31081.
            local loc = ngx.header["Location"]
            if loc then
                if type(loc) == "table" then
                    for i, v in ipairs(loc) do
                        loc[i] = v:gsub("://185%.253%.155%.4:8080", "://185.253.155.4:31081")
                    end
                else
                    ngx.header["Location"] = loc:gsub("://185%.253%.155%.4:8080", "://185.253.155.4:31081")
                end
            end
        }

        location /core/ {
            rewrite ^/core/(.*)$ /sicc/core/$1 break;
            proxy_pass http://{{ include "atom.fullname" . }}-backend:{{ .Values.backend.port }};
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /wms/ {
            rewrite ^/wms/(.*)$ /sicc-wms/wms/$1 break;
            proxy_pass http://{{ include "atom.fullname" . }}-backend:{{ .Values.backend.port }};
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Deep-link SPA del POS: al recargar /pos (o /pos/) la peticion NO es una
        # llamada API sino una ruta interna del frontend React (path="/pos").
        # Estos matches EXACTOS tienen prioridad sobre el prefijo /pos/ de abajo,
        # de modo que la SPA se sirve desde el frontend (try_files -> /index.html
        # -> React-router renderiza <Pos/>) y no se desvia al backend, que no
        # sirve la SPA (404 en GET /sicc-pos/pos/).
        location = /pos {
            proxy_pass http://{{ include "atom.fullname" . }}-frontend:{{ .Values.frontend.port }};
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /pos/ {
            proxy_pass http://{{ include "atom.fullname" . }}-frontend:{{ .Values.frontend.port }};
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API REST del POS (GET/POST /pos/sales/..., /pos/orders/...) -> backend
        location /pos/ {
            rewrite ^/pos/(.*)$ /sicc-pos/pos/$1 break;
            proxy_pass http://{{ include "atom.fullname" . }}-backend:{{ .Values.backend.port }};
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://{{ include "atom.fullname" . }}-backend:{{ .Values.backend.port }};
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://{{ include "atom.fullname" . }}-frontend:{{ .Values.frontend.port }};
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
