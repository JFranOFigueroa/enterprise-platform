---
argocd_version: "7.3.0"
argocd_namespace: gitops
argocd_chart_repo: https://argoproj.github.io/argo-helm

# Paths
# project_root: passed via --extra-vars from run-ansible.sh (auto-detected)
# Fallback: resolves to project root from this file's location (roles/gitops/defaults/)
project_root: "{{ playbook_dir }}/../../.."
repo_clone_dest: /opt/enterprise-platform

# Application deployment
# Applications are defined in group_vars/all.yml and read from
# applications/<name>/app_vars/<name>.yml
applications: []

# Convergence gate budget (FINAL GATE in tasks/main.yml).
# A first-time production deploy pulls dozens of images (kube-prometheus-stack,
# loki, cert-manager, apps) on the target node; 15 minutes (90x10s) is too tight
# on a single-node VPS. Override per environment (e.g. in secrets.yml or via
# --extra-vars) without touching the role:
#   deployment_gate_retries=120 deployment_gate_delay=15
deployment_gate_retries: 180
deployment_gate_delay: 10
