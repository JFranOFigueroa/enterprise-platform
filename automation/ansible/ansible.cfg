[defaults]
inventory = inventory/dev/hosts.yml
roles_path = roles
remote_user = root
host_key_checking = False
retry_files_enabled = False
stdout_callback = yaml
callback_whitelist = timer
# Force bash for all shell tasks. On Ubuntu/Debian the default /bin/sh is dash,
# which does NOT support bashisms (set -o pipefail, here-strings <<<). Several
# gitops tasks rely on those, causing failures on clean VPS/on-prem hosts that
# differ from the local lab. bash is always present on the reference OS (Ubuntu).
ansible_shell_executable = /bin/bash

[privilege_escalation]
become = True
become_method = sudo
become_user = root

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
