# =============================================================================
# Enterprise Platform - Platform Quotas ApplicationSet
# =============================================================================
# Deploys ResourceQuota + LimitRange via ArgoCD ONLY to clusters labeled
# `env-policies: enabled` (typically production), because the quotas target
# namespaces like `apps-production` that do not exist in every environment.
#
# Without this gate the quotas Application could never become Synced/Healthy in
# environments lacking the target namespace, blocking the final convergence gate.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-quotas
  namespace: gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
            env-policies: enabled
  template:
    metadata:
      name: "platform-{{ .name }}-quotas"
    spec:
      project: enterprise-platform
      sources:
        - repoURL: https://github.com/JFranOFigueroa/enterprise-platform.git
          targetRevision: main
          path: platform/policies/quotas
          directory:
            recurse: false
      destination:
        server: "{{ .server }}"
        namespace: ""
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 10
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 10m
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
          - TimeoutSeconds=300
