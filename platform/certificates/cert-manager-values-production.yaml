# Enterprise Platform - cert-manager Values (production overlay)
# =============================================================================
# Loaded automatically by platform-apps.yaml AFTER the base values when this
# file exists for the cluster:
#   platform/certificates/cert-manager-values-<cluster>.yaml
#
# This overlay is intentionally empty (neutral): there are no production-only
# settings for cert-manager yet, so it inherits the base values unchanged.
#
# The ApplicationSet appends this valueFile after the base one but also sets
# IgnoreMissingValueFiles=true (see platform/components/platform-apps.yaml), so
# this file is a placeholder rather than a requirement: removing it leaves the
# Application Synced. Keep it to host per-environment overrides.
#
# SCHEMA: only add keys the chart accepts. The chart declares
# additionalProperties=false at the root, so an unrecognised key (for example
# priorityClassName, which cert-manager v1.17.1 does not support) fails
# `helm template` with a ComparisonError and the Application never syncs.
#
# Add production-only overrides here as needed (e.g. replicaCount, tolerations,
# extra args for the Let's Encrypt production issuer).
# -----------------------------------------------------------------------------
