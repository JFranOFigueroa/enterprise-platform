# Enterprise Platform - Sealed Secrets Controller Values
# Deployed via platform-apps.yaml ApplicationSet (component: sealed-secrets)
#
# The SealedSecrets controller decrypts committed SealedSecrets into plain
# Kubernetes Secrets, enabling GitOps-compliant secret management for tenants.
# kubeseal fetches the public certificate from:
#   http://sealed-secrets-controller.platform-sealed-secrets.svc:8080/v1/cert.pem
namespace: platform-sealed-secrets
fullnameOverride: sealed-secrets-controller
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi
metrics:
  serviceMonitor:
    enabled: false
