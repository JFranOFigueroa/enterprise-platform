# Enterprise Platform - Prometheus Stack Values (base)
# =============================================================================
# Base values are environment-agnostic. Production-only settings (real domain,
# TLS issuer, admin credentials) live in the per-environment overlay:
#   platform/monitoring/kube-prometheus-stack-values-<cluster>.yaml
# which platform-apps.yaml appends automatically when present
# (see IgnoreMissingValueFiles sync option).
# =============================================================================
prometheus:
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - prometheus.localhost
    path: /
    pathType: Prefix
  prometheusSpec:
    priorityClassName: platform-high
    retention: 15d
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          storageClassName: local-path
          resources:
            requests:
              storage: 10Gi

grafana:
  enabled: true
  initChownData:
    enabled: false
  # Dev default only. Override for production via the per-environment overlay
  # (adminExistingSecret) - never commit production credentials here.
  adminPassword: admin
  priorityClassName: platform-high
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: local-path
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 200m
      memory: 512Mi
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - grafana.localhost
    path: /
    pathType: Prefix

alertmanager:
  enabled: true
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - alertmanager.localhost
    path: /
    pathType: Prefix
  alertmanagerSpec:
    priorityClassName: platform-high
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          storageClassName: local-path
          resources:
            requests:
              storage: 1Gi
  # Alertmanager routing/receivers (raw config, merged by the chart).
  # Receivers are intentionally empty placeholders: wire each environment's
  # notification endpoint (webhook/slack/email) in the per-environment overlay.
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ["alertname", "cluster"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: default
      routes:
        - matchers:
            - 'severity="critical"'
          receiver: platform-critical
          repeat_interval: 1h
        - matchers:
            - 'severity="warning"'
          receiver: platform-warning
          repeat_interval: 4h
    receivers:
      - name: default
      - name: platform-critical
      - name: platform-warning

additionalPrometheusRulesMap:
  platform-alerts:
    groups:
      - name: platform-resource-alerts
        rules:
          # Node CPU > 90% for 5 minutes
          - alert: NodeHighCPU
            expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Node {{ $labels.instance }} CPU > 90%"

          # Node memory > 90% for 5 minutes
          - alert: NodeHighMemory
            expr: 100 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes * 100) > 90
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Node {{ $labels.instance }} memoria > 90%"

          # Pod OOMKilled
          - alert: PodOOMKilled
            expr: kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} > 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Pod {{ $labels.pod }} OOMKilled"

          # HPA at max replicas (cannot scale further)
          - alert: HPAAtMaxReplicas
            expr: kube_horizontalpodautoscaler_status_current_replicas == kube_horizontalpodautoscaler_spec_max_replicas
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "HPA {{ $labels.horizontalpodautoscaler }} en maximo replicas"

          # Pod in CrashLoopBackOff
          - alert: PodCrashLooping
            expr: rate(kube_pod_container_status_restarts_total[15m]) * 60 * 15 > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ $labels.pod }} en CrashLoopBackOff"

          # PVC almost full (>85%)
          - alert: PVCNearFull
            expr: kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes > 0.85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "PVC {{ $labels.persistentvolumeclaim }} > 85% lleno"

serviceMonitors:
  - name: platform-ingress-nginx
    namespaceSelector:
      matchNames:
        - ingress-nginx
    selector:
      matchLabels:
        app.kubernetes.io/name: ingress-nginx
    endpoints:
      - port: metrics
        interval: 30s

  - name: platform-cert-manager
    namespaceSelector:
      matchNames:
        - cert-manager
    selector:
      matchLabels:
        app.kubernetes.io/name: cert-manager
    endpoints:
      - port: metrics
        interval: 30s

  - name: platform-loki
    namespaceSelector:
      matchNames:
        - platform-logging
    selector:
      matchLabels:
        app.kubernetes.io/name: loki
    endpoints:
      - port: http-metrics
        interval: 30s

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true
